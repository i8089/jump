<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181d" id="theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jump">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Jump Rope Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one screen, the whole background is the signal. Hot orange = jump, cool blue = rest,
   readable from across the room. Single dark-world theme by choice. */
:root {
  color-scheme: dark;
  --bg: #15181d;
  --ink: #f2eee6;
  --muted: rgba(242, 238, 230, .58);
  --track: rgba(242, 238, 230, .16);
  --btn-bg: #f2eee6;
  --btn-ink: #15181d;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body[data-phase="rest"] {
  --bg: #0e2c4a;
  --ink: #e1efff;
  --muted: rgba(225, 239, 255, .62);
  --track: rgba(225, 239, 255, .18);
  --btn-bg: #e1efff;
  --btn-ink: #0e2c4a;
}
body[data-phase="jump"] {
  --bg: #ff5a1f;
  --ink: #1c0a02;
  --muted: rgba(28, 10, 2, .66);
  --track: rgba(28, 10, 2, .2);
  --btn-bg: #1c0a02;
  --btn-ink: #ffe9df;
}
body[data-phase="done"] {
  --bg: #12382a;
  --ink: #e4f7ea;
  --muted: rgba(228, 247, 234, .62);
  --track: rgba(228, 247, 234, .18);
  --btn-bg: #e4f7ea;
  --btn-ink: #12382a;
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  transition: background-color .35s ease, color .35s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
@media (prefers-reduced-motion: reduce) {
  body, button { transition: none; }
}

.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: .95rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.top .round { font-variant-numeric: tabular-nums; color: var(--ink); }

.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.phase {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 10vw, 3.4rem);
  letter-spacing: .06em;
  text-transform: uppercase;
  line-height: 1;
}
.count {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(8rem, 52vw, 19rem);
  line-height: .86;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  margin-left: -.04em;
}
.hint {
  color: var(--muted);
  font-size: 1.05rem;
  min-height: 1.4em;
}

.bottom { display: flex; flex-direction: column; gap: 14px; }

.rounds { display: flex; gap: 8px; }
.rounds .r { display: flex; gap: 2px; }
.seg {
  height: 10px;
  background: var(--track);
  overflow: hidden;
}
.r .seg:first-child { border-radius: 5px 0 0 5px; }
.r .seg:last-child { border-radius: 0 5px 5px 0; }
.r .seg:only-child { border-radius: 5px; }
.seg i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--ink);
}
.meta {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .95rem;
  font-variant-numeric: tabular-nums;
}

.controls { display: flex; gap: 12px; }
button {
  font: inherit;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.9rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 0;
  border-radius: 18px;
  min-height: 76px;
  cursor: pointer;
  transition: transform .08s ease, background-color .35s ease, color .35s ease;
}
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#go {
  flex: 1;
  background: var(--btn-bg);
  color: var(--btn-ink);
}
#reset {
  flex: 0 0 96px;
  background: transparent;
  color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--track);
  font-size: 1.2rem;
}
#reset[hidden] { display: none; }
</style>
</head>
<body data-phase="idle">
<main class="app">
  <div class="top">
    <span>Jump rope</span>
    <span class="round" id="round">5 rounds</span>
  </div>

  <div class="stage">
    <div class="phase" id="phase">Ready</div>
    <div class="count" id="count">5:00</div>
    <div class="hint" id="hint">1 min jump, then 15 s rest / 45 s jump.</div>
  </div>

  <div class="bottom">
    <div class="rounds" id="rounds" aria-hidden="true"></div>
    <div class="meta">
      <span id="elapsed">0:00</span>
      <span id="left">5:00 left</span>
    </div>
    <div class="controls">
      <button id="go" type="button">Start</button>
      <button id="reset" type="button" hidden>Reset</button>
    </div>
  </div>
</main>

<script>
(function () {
  var WORK = 45, REST = 15, ROUNDS = 5, LEAD = 3;

  // Timeline: 3 s get-ready countdown, then jump/rest, ending on the last jump.
  var phases = [{ k: 'ready', d: LEAD, r: -1 }];
  for (var i = 0; i < ROUNDS; i++) {
    phases.push({ k: 'jump', d: i === 0 ? 60 : WORK, r: i });
    if (i < ROUNDS - 1) phases.push({ k: 'rest', d: REST, r: i });
  }
  var acc = 0;
  phases.forEach(function (p) { p.s = acc; acc += p.d; p.e = acc; });
  var END = acc;                 // includes lead-in
  var WORKOUT = END - LEAD;      // 4:45

  var body = document.body;
  var $ = function (id) { return document.getElementById(id); };
  var phaseEl = $('phase'), countEl = $('count'), hintEl = $('hint'),
      roundEl = $('round'), elapsedEl = $('elapsed'), leftEl = $('left'),
      goBtn = $('go'), resetBtn = $('reset'), roundsEl = $('rounds');

  // Progress bar: one group per round, jump | rest
  var groups = [];
  phases.forEach(function (p) {
    if (p.r < 0) return;
    if (!groups[p.r]) {
      var g = document.createElement('div'); g.className = 'r';
      roundsEl.appendChild(g); groups[p.r] = g; g._w = 0;
    }
    var s = document.createElement('div'); s.className = 'seg';
    s.style.flex = p.d;
    var f = document.createElement('i'); s.appendChild(f);
    groups[p.r].appendChild(s); groups[p.r]._w += p.d;
    p.fill = f;
  });
  groups.forEach(function (g) { g.style.flex = g._w; });

  // ---- Sound. The whole session is rendered into one WAV and played through
  // an <audio> element. Media playback ignores the iPhone silent switch,
  // where Web Audio beeps are muted by it.
  var RATE = 16000;
  var samples = new Float32Array(Math.ceil((END + 2) * RATE));

  function tone(at, freq, dur, vol) {
    var a = Math.floor(at * RATE), n = Math.floor(dur * RATE);
    var att = Math.floor(0.008 * RATE), rel = Math.floor(0.04 * RATE);
    for (var j = 0; j < n; j++) {
      var env = j < att ? j / att : (j > n - rel ? (n - j) / rel : 1);
      var ph = (j * freq / RATE) % 1;
      // softened square: square plus a little sine, loud and clear on phone speakers
      var v = (ph < 0.5 ? 1 : -1) * 0.75 + Math.sin(2 * Math.PI * ph) * 0.25;
      samples[a + j] += v * vol * env;
    }
  }
  function ticks(before, freq, vol) {
    [3, 2, 1].forEach(function (n) { tone(before - n, freq, 0.09, vol); });
  }
  function rising(at) { tone(at, 880, 0.14, 0.5); tone(at + 0.16, 1320, 0.45, 0.5); }
  function falling(at) { tone(at, 660, 0.14, 0.5); tone(at + 0.16, 330, 0.5, 0.5); }

  phases.forEach(function (p, idx) {
    if (p.k === 'ready') {
      ticks(p.e, 660, 0.35);
    } else if (p.k === 'jump') {
      rising(p.s);
      if (idx === phases.length - 1) {
        ticks(p.e, 440, 0.3);
        [523, 659, 784, 1047].forEach(function (f, k) {
          tone(p.e + k * 0.17, f, k === 3 ? 0.6 : 0.15, 0.45);
        });
      } else {
        ticks(p.e, 440, 0.3);
      }
    } else if (p.k === 'rest') {
      falling(p.s);
      ticks(p.e, 660, 0.35);
    }
  });

  function wavUrl(f32) {
    var n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function str(o, s) { for (var k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    for (var k = 0, o = 44; k < n; k++, o += 2) {
      var s = Math.max(-1, Math.min(1, f32[k]));
      v.setInt16(o, s * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  var audio = new Audio();
  audio.preload = 'auto';
  audio.setAttribute('playsinline', '');
  audio.src = wavUrl(samples);
  samples = null;

  // Newer iOS Safari: tell the system this page plays media, not alerts.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

  var state = 'idle', raf = 0, wake = null;

  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function lockScreenOn() {
    try {
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
    } catch (e) {}
  }
  function lockScreenOff() {
    try { if (wake) wake.release(); } catch (e) {}
    wake = null;
  }

  var themeMeta = document.getElementById('theme');
  var themeColors = { idle: '#15181d', rest: '#0e2c4a', jump: '#ff5a1f', done: '#12382a' };
  function render() {
    var t = state === 'idle' ? 0 : Math.min(END, audio.currentTime);
    if (state !== 'idle' && state !== 'done' && t >= END) finish();

    var cur = phases[phases.length - 1];
    for (var i = 0; i < phases.length; i++) {
      if (t < phases[i].e) { cur = phases[i]; break; }
    }
    var paused = state === 'paused' ? ' · paused' : '';

    if (state === 'idle') {
      body.dataset.phase = 'idle';
      phaseEl.textContent = 'Ready';
      countEl.textContent = fmt(WORKOUT);
      hintEl.textContent = '1 min jump, then 15 s rest / 45 s jump.';
      roundEl.textContent = ROUNDS + ' rounds';
      goBtn.textContent = 'Start';
      resetBtn.hidden = true;
    } else if (state === 'done') {
      body.dataset.phase = 'done';
      phaseEl.textContent = 'Done';
      countEl.textContent = fmt(WORKOUT);
      hintEl.textContent = 'Five rounds finished. Enjoy your meal.';
      roundEl.textContent = ROUNDS + ' / ' + ROUNDS;
      goBtn.textContent = 'Again';
      resetBtn.hidden = true;
    } else {
      body.dataset.phase = cur.k === 'ready' ? 'idle' : cur.k;
      countEl.textContent = Math.max(1, Math.ceil(cur.e - t));
      if (cur.k === 'ready') {
        phaseEl.textContent = 'Get ready' + paused;
        hintEl.textContent = 'Grab the rope. Jump on the rising tone.';
        roundEl.textContent = 'Round 1 / ' + ROUNDS;
      } else {
        phaseEl.textContent = (cur.k === 'jump' ? 'Jump' : 'Rest') + paused;
        hintEl.textContent = cur.k === 'rest' ? 'Next jump starts on the rising tone.'
          : (cur.r === ROUNDS - 1 ? 'Last round.' : 'Rest starts on the falling tone.');
        roundEl.textContent = 'Round ' + (cur.r + 1) + ' / ' + ROUNDS;
      }
      goBtn.textContent = state === 'paused' ? 'Resume' : 'Pause';
      resetBtn.hidden = false;
    }

    phases.forEach(function (p) {
      if (!p.fill) return;
      var pct = state === 'done' ? 100 : Math.min(100, Math.max(0, (t - p.s) / p.d * 100));
      p.fill.style.width = pct + '%';
    });
    var w = state === 'done' ? WORKOUT : Math.max(0, t - LEAD);
    elapsedEl.textContent = fmt(Math.floor(w));
    leftEl.textContent = state === 'done' ? 'Complete' : fmt(WORKOUT - w) + ' left';

    var tc = themeColors[body.dataset.phase] || themeColors.idle;
    if (themeMeta.content !== tc) themeMeta.content = tc;
    if (state === 'running') raf = requestAnimationFrame(render);
  }

  function finish() {
    state = 'done';
    cancelAnimationFrame(raf);
    lockScreenOff();
  }

  function play() {
    var p = audio.play();
    state = 'running';
    lockScreenOn();
    cancelAnimationFrame(raf);
    render();
    if (p && p.catch) p.catch(function () {
      state = 'paused';
      render();
      hintEl.textContent = 'Sound was blocked. Tap Resume to try again.';
    });
  }

  goBtn.addEventListener('click', function () {
    if (state === 'idle' || state === 'done') {
      try { audio.currentTime = 0; } catch (e) {}
      play();
    } else if (state === 'running') {
      audio.pause();
      state = 'paused';
      cancelAnimationFrame(raf);
      lockScreenOff();
      render();
    } else if (state === 'paused') {
      play();
    }
  });

  resetBtn.addEventListener('click', function () {
    audio.pause();
    try { audio.currentTime = 0; } catch (e) {}
    cancelAnimationFrame(raf);
    lockScreenOff();
    state = 'idle';
    render();
  });

  audio.addEventListener('ended', function () {
    if (state === 'running') { finish(); render(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); goBtn.click(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state === 'running') {
      lockScreenOn();
      cancelAnimationFrame(raf);
      render();
    }
  });

  render();

  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
})();
</script>
</body>
</html>
